name: A10 Team Match full matrix

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    name: Supported 136-scenario matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run all supported Team Match configurations
        run: >-
          dotnet test src/Tests/Belot.WebApi.Tests/Belot.WebApi.Tests.csproj
          --configuration Release
          --filter "Category=TeamMatchSmoke|Category=TeamMatchBoundary|Category=TeamMatchMatrix|Category=TeamMatchAutonomous"
          --logger "trx;LogFileName=a10-full-matrix.trx"
          --results-directory TestResults/A10Matrix
      - name: Upload full matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a10-team-match-119-scenario-report
          path: TestResults/**/*.trx
          if-no-files-found: error
